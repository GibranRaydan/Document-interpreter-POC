services:

  # ── App Database ────────────────────────────────────────────────────────────
  db:
    image: postgres:17.4-alpine
    restart: no
    container_name: courtney-db
    env_file: ./core_project/.env
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./data/db-init:/docker-entrypoint-initdb.d   # creates langfuse DB on first boot
    ports:
      - 5432:5432

  # ── Django API ───────────────────────────────────────────────────────────────
  # backend:
  #   image: courtney-api
  #   build:
  #     context: .
  #     dockerfile: dockerfile
  #   restart: no
  #   container_name: courtney-api
  #   env_file: ./core_project/.env
  #   # command:  python manage.py runserver 0.0.0.0:8000
  #   command: uvicorn core_project.asgi:application --reload --host 0.0.0.0 --port 8000
  #   # --workers 4 --timeout-keep-alive 300 # Command production
  #   volumes:
  #     - ./:/srv/www/api
  #   ports:
  #     - 8000:8000
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   depends_on:
  #     - db

  # ── Langfuse Observability ───────────────────────────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse-web
    restart: unless-stopped
    depends_on:
      - db
      - langfuse-redis
      - langfuse-clickhouse
      - langfuse-minio
    ports:
      - "3000:3000"
    env_file: ./core_project/.langfuse.env
    environment:
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - MINIO_ENDPOINT=langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on:
      - db
      - langfuse-redis
      - langfuse-clickhouse
      - langfuse-minio
    env_file: ./core_project/.langfuse.env
    environment:
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - MINIO_ENDPOINT=langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9090" /data'
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=miniopassword
    volumes:
      - langfuse-minio-data:/data
    ports:
      - "9090:9090"   # MinIO console (optional)

  langfuse-redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    restart: unless-stopped
    command: redis-server --requirepass redispassword
    volumes:
      - langfuse-redis-data:/data

volumes:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
